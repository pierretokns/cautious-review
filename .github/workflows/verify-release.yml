name: Verify and publish preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Check ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [unit, browser]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run models
      - if: matrix.check == 'unit'
        run: npm test
      - if: matrix.check == 'browser'
        run: npm run build
      - if: matrix.check == 'browser'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.8.22'
      - if: matrix.check == 'browser'
        run: uv run --with playwright==1.57.0 playwright install --with-deps chromium
      - if: matrix.check == 'browser'
        name: Synthetic browser workflow
        run: |
          uv run --with playwright==1.57.0 python tests/browser_smoke.py
          uv run --with playwright==1.57.0 python tests/browser_live.py
          uv run --with playwright==1.57.0 python tests/browser_session.py
          uv run --with playwright==1.57.0 python tests/browser_session_reader.py
      - if: matrix.check == 'browser' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-browser-preview
          path: artifacts/*preview.png
          retention-days: 14
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run models
      - run: npm test && npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-extension-package
          if-no-files-found: error
          path: |
            artifacts/*.zip
            artifacts/*.crx
            artifacts/*.mjs
            artifacts/BUILD.json
            artifacts/SHA256SUMS
          retention-days: 14
  release:
    needs: [checks, package]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-extension-package
          path: artifacts
      - run: cd artifacts && sha256sum --check SHA256SUMS
      - name: Publish the exact verified artifacts (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="preview-${COMMIT:0:12}"
          notes='0.3.3 adds exact recruiter host support through app15, including app6; fixes panel and reader identity after in-page navigation; accepts approved signed document URLs up to 16 KB consistently; corrects the Chrome minimum to 128; and clarifies no-admin setup. Current-tab identity checks use only the same finite Greenhouse host permissions, without global tabs access. No-admin page-linked PDF extraction and offline MiniLM search remain read-only. Browser-session candidate mutations remain unimplemented; the optional Harvest v3 path supports explicit human-confirmed actions. Unit and synthetic browser checks passed, including app6 PDF reading, app15 activation, navigation, and offline model inference. No real Greenhouse end-to-end validation was performed. ZIP: extract and Load unpacked, then reload Greenhouse. CRX: verified self-signed preview with ephemeral identity, not Web Store signed or a stable update channel.'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Commit-specific release already exists; refusing to replace verified bytes."
          else
            gh release create "$tag" artifacts/*.zip artifacts/*.crx artifacts/*.mjs artifacts/SHA256SUMS artifacts/BUILD.json \
              --target "$COMMIT" --prerelease --title "Cautious Review 0.3.3 preview ${COMMIT:0:12}" --notes "$notes"
          fi
  audit-greenmaxing:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Static public CRX inspection; never execute third-party code
        run: node scripts/audit-greenmaxing.mjs --download
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: greenmaxing-static-report
          path: audit-artifacts/greenmaxing-report.json
          if-no-files-found: warn
          retention-days: 30
