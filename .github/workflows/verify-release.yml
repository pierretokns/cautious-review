name: Verify and publish preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Check ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [unit, browser]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run models
      - if: matrix.check == 'unit'
        run: npm test
      - if: matrix.check == 'browser'
        run: npm run build
      - if: matrix.check == 'browser'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.8.22'
      - if: matrix.check == 'browser'
        run: uv run --with playwright==1.57.0 playwright install --with-deps chromium
      - if: matrix.check == 'browser'
        name: Synthetic browser workflow
        run: |
          uv run --with playwright==1.57.0 python tests/browser_smoke.py
          uv run --with playwright==1.57.0 python tests/browser_live.py
          uv run --with playwright==1.57.0 python tests/browser_session.py
      - if: matrix.check == 'browser' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-browser-preview
          path: artifacts/*preview.png
          retention-days: 14
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run models
      - run: npm test && npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-extension-package
          if-no-files-found: error
          path: |
            artifacts/*.zip
            artifacts/*.crx
            artifacts/*.mjs
            artifacts/BUILD.json
            artifacts/SHA256SUMS
          retention-days: 14
  release:
    needs: [checks, package]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-extension-package
          path: artifacts
      - run: cd artifacts && sha256sum --check SHA256SUMS
      - name: Publish the exact verified artifacts (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="preview-${COMMIT:0:12}"
          notes='0.3.1 preview adds opt-in local browser-session diagnostics that export sanitized request structure only. Direct browser-session actions are not yet implemented or validated; work-account observations are required. Optional Harvest v3 integration: explicit human-confirmed reject, advance, same-job move and unreject; verified identity, refreshed previews, durable intent/receipts, read-after-write checks and no blind write retries. A separate cautious-review-token.mjs helper mints a short-lived OAuth token; the client secret never enters the extension. Requires v3 endpoint permissions and a Site Admin user for list calls. Automatic PDF/text resume extraction and bundled offline MiniLM hybrid retrieval. Passed unit and synthetic browser fixtures, including local WASM inference. NOT validated end-to-end against a real Greenhouse account. ZIP: extract and Load unpacked. CRX is a verified self-signed preview, NOT Web Store signed, with ephemeral identity and no update continuity.'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Commit-specific release already exists; refusing to replace verified bytes."
          else
            gh release create "$tag" artifacts/*.zip artifacts/*.crx artifacts/*.mjs artifacts/SHA256SUMS artifacts/BUILD.json \
              --target "$COMMIT" --prerelease --title "Cautious Review 0.3.1 preview ${COMMIT:0:12}" --notes "$notes"
          fi
  audit-greenmaxing:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Static public CRX inspection; never execute third-party code
        run: node scripts/audit-greenmaxing.mjs --download
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: greenmaxing-static-report
          path: audit-artifacts/greenmaxing-report.json
          if-no-files-found: warn
          retention-days: 30
