name: Verify and publish preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.8.22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Install fixture browser
        run: uv run --with playwright==1.57.0 playwright install --with-deps chromium
      - name: Browser fixture tests (no live Greenhouse)
        run: uv run --with playwright==1.57.0 python tests/browser_smoke.py
      - run: npm run package
  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test && npm run package
      - name: Publish verified commit-specific preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="preview-${COMMIT:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.zip artifacts/SHA256SUMS --clobber
          else
            gh release create "$tag" artifacts/*.zip artifacts/SHA256SUMS \
              --target "$COMMIT" --prerelease --title "Cautious Review preview ${COMMIT:0:12}" \
              --notes "Passed typecheck, unit and offline browser-fixture tests. Extract ZIP; load unpacked in Chrome. Local queue only: no live Greenhouse writes, no embeddings, no embedded-PDF extraction yet. Not a live Greenhouse integration certification."
          fi
