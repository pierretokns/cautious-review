name: Verify and publish preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.16.0', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.16.0', cache: npm }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: { version: '0.8.22' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install fixture browser
        run: uv run --with playwright==1.57.0 playwright install --with-deps chromium
      - name: Browser fixture tests (synthetic data; no live Greenhouse)
        run: uv run --with playwright==1.57.0 python tests/browser_smoke.py

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.16.0', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build && npm run package

  release:
    needs: [unit, browser, package]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22.16.0', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test && npm run package
      - name: Publish verified commit-specific preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="preview-${COMMIT:0:12}"
          notes='Passed TypeScript/unit tests, packaging checks, and the offline synthetic browser-fixture gate. ZIP is the primary desktop live-test artifact: extract and Load unpacked. The CRX is a cryptographically checked self-signed preview container, not Chrome Web Store signed; standard Windows/macOS Chrome should use the ZIP/unpacked flow. No live Greenhouse writes, hosted inference, automatic PDF extraction, or local embedding model are enabled.'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.zip artifacts/*.crx artifacts/SHA256SUMS artifacts/BUILD.json --clobber
          else
            gh release create "$tag" artifacts/*.zip artifacts/*.crx artifacts/SHA256SUMS artifacts/BUILD.json \
              --target "$COMMIT" --prerelease --title "Cautious Review preview ${COMMIT:0:12}" --notes "$notes"
          fi
